  - name: ZDNet Korea
    url: https://feeds.feedburner.com/zdkorea
    region: kr
    trust: medium
  - name: 디지털데일리
    url: https://www.ddaily.co.kr/rss/allArticle.xml
    region: kr
    trust: medium
  - name: 과학기술정보통신부
    url: https://www.msit.go.kr/bbs/rss.do?sCode=user&mId=113&mPid=112
    region: kr
    trust: high
  - name: ETRI 웹진
    url: https://www.etri.re.kr/rss/press.xml
    region: kr
    trust: high

# ── 학회 마감일 ────────────────────────────────────────────────
# 자동 크롤링이 불안정한 영역이라 직접 관리합니다.
# 날짜(YYYY-MM-DD)만 매년 갱신해 주세요.
conferences:
  - name: CVPR 2027
    deadline: 2026-11-14
    url: https://cvpr.thecvf.com/
  - name: ICCV 2027
    deadline: 2027-03-08
    url: https://iccv.thecvf.com/
  - name: NeurIPS 2026
    deadline: 2026-05-15
    url: https://neurips.cc/
  - name: AAAI 2027
    deadline: 2026-08-15
    url: https://aaai.org/
  - name: ICLR 2027
    deadline: 2026-09-24
    url: https://iclr.cc/
  - name: SIGGRAPH 2027
    deadline: 2027-01-20
    url: https://www.siggraph.org/

# ── 출력 설정 ──────────────────────────────────────────────────
output:
  max_items: 40           # 사이트에 실을 최대 개수
  lookback_days: 7        # 며칠 이내 것만 수집
  min_score: 3            # 이 점수 미만은 버림
  seen_ttl_days: 90       # 중복 판정용 기록 보관 기간
