# ═══════════════════════════════════════════════════════════════
#  Signals — 수집 소스 설정
#  여기만 고치면 크롤링 대상이 바뀝니다. 코드는 건드리지 않아도 됩니다.
# ═══════════════════════════════════════════════════════════════

# ── 관심 키워드 ────────────────────────────────────────────────
# 가중치가 높을수록 우선 노출됩니다.
# 항목 하나라도 걸리지 않으면 수집에서 제외됩니다.
keywords:
  core:            # 가중치 3 — 나의 핵심 연구 영역
    - vision language model
    - multimodal
    - world model
    - physical ai
    - embodied
    - video generation
    - frame interpolation
    - inbetweening
    - self-play
    - knowledge graph
    - ai for science
    - 3d reconstruction
    - cad
    - blueprint
    - floor plan

  adjacent:        # 가중치 2 — 인접 영역
    - diffusion
    - vlm
    - mllm
    - robot manipulation
    - scene understanding
    - remote sensing
    - point cloud
    - animation
    - controllable generation
    - reinforcement learning
    - reasoning

  korean:          # 가중치 2 — 국내 기사용 한글 키워드
    - 멀티모달
    - 비전 언어
    - 월드 모델
    - 피지컬 AI
    - 로봇
    - 생성 AI
    - 파운데이션 모델
    - 자율주행
    - 디지털 트윈
    - 과학기술 AI
    - 산업 AI

  exclude:         # 이 단어가 제목에 있으면 버림 (홍보·잡음 제거)
    - webinar
    - 웨비나
    - 채용
    - 이벤트 안내
    - 할인
    - coupon

# ── arXiv ──────────────────────────────────────────────────────
arxiv:
  enabled: true
  categories: [cs.CV, cs.AI, cs.LG, cs.RO, cs.GR, cs.CL]
  max_per_category: 60
  trust: high

# ── Hugging Face ───────────────────────────────────────────────
huggingface:
  enabled: true
  fetch: [models, datasets]
  limit: 40
  min_likes: 15          # 이 미만은 노이즈로 간주
  trust: medium

# ── RSS 피드 ───────────────────────────────────────────────────
# region: global | kr      trust: high | medium
# 접속이 안 되는 피드는 자동으로 건너뛰고 로그에 남깁니다.
rss:
